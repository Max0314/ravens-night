name: fribench-ravens-night
services:
  app:
    image: fribench-ravens-night:${RAVENS_VERSION:?Set an immutable source commit}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: [/etc/fribench/apps/ravens-night/app.env]
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://clocktower.fribench.cn
      ACCESS_PASSWORD: ""
    ports: ["127.0.0.1:23005:3000"]
    networks: [backend, identity]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD,node,-e,"fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m,max-file: "3"}
networks:
  backend:
    external: true
    name: fribench-backend
  identity:
    external: true
    name: fribench-services-edge-v1
