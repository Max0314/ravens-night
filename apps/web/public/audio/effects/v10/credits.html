<li>菜单打开和关闭使用 DavidGreck 的 <a href="https://bigsoundbank.com/switch-5-s0321.html">Switch #5</a> 中的两次按击，分别截取并调整音量。<a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a></li>
